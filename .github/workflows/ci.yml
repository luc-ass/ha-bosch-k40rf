name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The interpreter is not a choice: Home Assistant 2026.9 needs 3.14.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install
        run: |
          uv venv
          uv pip install --group dev
          # The library is not a dev dependency. Home Assistant installs what
          # the manifest pins, so CI reads the pin from there and tests that
          # exact version -- one place to bump, and no way for the two to drift.
          uv pip install "$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("custom_components/bosch_k40rf/manifest.json").read_text())["requirements"][0])')"

      - name: Ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy custom_components

      # Bronze asks for full config-flow coverage; the floor is well under
      # where the suite actually sits, so it catches a collapse, not a rounding.
      - name: Tests
        run: >
          .venv/bin/pytest
          --cov=custom_components/bosch_k40rf
          --cov-report=term-missing
          --cov-fail-under=95

      # strings.json and translations/en.json are written by the generator from
      # the catalogue and strings.base.json. Only the generated files ship, so
      # an edit to one of them alone would go out and then be overwritten.
      - name: The generated files are current
        run: |
          .venv/bin/python tools/generate_strings.py
          .venv/bin/python tools/quality_report.py
          git diff --exit-code custom_components/bosch_k40rf/strings.json custom_components/bosch_k40rf/translations/en.json QUALITY.md
